    <text x="18" y="110" fill="#6D665C" font-family="Arial, sans-serif" font-size="14">RSS + multilingual</text>
    <text x="18" y="132" fill="#6D665C" font-family="Arial, sans-serif" font-size="14">dedupe + normalize</text>
  </g>

