<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Transfer Stock Analyst demo walkthrough storyboard</title>
  <desc id="desc">Storyboard placeholder showing dashboard, agent run, citations, and report outputs.</desc>
  <rect width="1200" height="520" fill="#f8faf9"/>
  <text x="48" y="58" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#16211f">Demo walkthrough</text>
  <text x="48" y="88" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5f6f6a">Replace this storyboard with docs/demo-walkthrough.gif before launch.</text>

  <g transform="translate(48,130)">
    <rect width="250" height="300" rx="8" fill="#ffffff" stroke="#d8e2de"/>
    <circle cx="28" cy="30" r="10" fill="#2c7a6b"/>
    <text x="48" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16211f">1. Open dashboard</text>
    <rect x="24" y="64" width="202" height="40" rx="6" fill="#eef8f6"/>
    <rect x="24" y="118" width="92" height="74" rx="6" fill="#f7f1e8" stroke="#e5d7c2"/>
    <rect x="134" y="118" width="92" height="74" rx="6" fill="#f7f1e8" stroke="#e5d7c2"/>
    <rect x="24" y="210" width="202" height="44" rx="6" fill="#f8faf9" stroke="#d8e2de"/>
    <text x="24" y="282" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5f6f6a">Live signals and club filters.</text>
  </g>

  <g transform="translate(326,130)">
    <rect width="250" height="300" rx="8" fill="#ffffff" stroke="#d8e2de"/>
    <circle cx="28" cy="30" r="10" fill="#2563eb"/>
    <text x="48" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16211f">2. Ask analyst</text>
    <rect x="24" y="66" width="202" height="42" rx="8" fill="#ffffff" stroke="#cbd8d3"/>
    <text x="38" y="92" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5f6f6a">Explain Casemiro</text>
    <rect x="24" y="128" width="202" height="82" rx="6" fill="#eef8f6"/>
    <line x1="42" y1="152" x2="200" y2="152" stroke="#8bc9be" stroke-width="6" stroke-linecap="round"/>
    <line x1="42" y1="176" x2="168" y2="176" stroke="#8bc9be" stroke-width="6" stroke-linecap="round"/>
    <text x="24" y="282" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5f6f6a">Grounded answer from local data.</text>
  </g>

  <g transform="translate(604,130)">
    <rect width="250" height="300" rx="8" fill="#ffffff" stroke="#d8e2de"/>
    <circle cx="28" cy="30" r="10" fill="#f59e0b"/>
    <text x="48" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16211f">3. Run agent</text>
    <rect x="24" y="66" width="202" height="50" rx="6" fill="#111827"/>
    <text x="38" y="96" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#d1fae5">agent-run --goal ...</text>
    <rect x="24" y="136" width="202" height="116" rx="6" fill="#fcfbf8" stroke="#e5d7c2"/>
    <text x="42" y="164" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16211f">plan -> evidence -> scenario</text>
    <text x="42" y="192" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16211f">trace.jsonl</text>
    <text x="42" y="220" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16211f">agent_report.md</text>
    <text x="24" y="282" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5f6f6a">A traceable local AI workflow.</text>
  </g>

  <g transform="translate(882,130)">
    <rect width="250" height="300" rx="8" fill="#ffffff" stroke="#d8e2de"/>
    <circle cx="28" cy="30" r="10" fill="#7c3aed"/>
    <text x="48" y="36" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16211f">4. Review evidence</text>
    <rect x="24" y="66" width="202" height="54" rx="6" fill="#eef8f6"/>
    <rect x="24" y="134" width="202" height="54" rx="6" fill="#f7f1e8"/>
    <rect x="24" y="202" width="202" height="54" rx="6" fill="#f8faf9" stroke="#d8e2de"/>
    <text x="42" y="98" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16211f">article citation</text>
    <text x="42" y="166" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16211f">transfer comp</text>
    <text x="42" y="234" font-family="Inter, Arial, sans-serif" font-size="13" fill="#16211f">what changed</text>
    <text x="24" y="282" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5f6f6a">Citations and memory in one panel.</text>
  </g>
</svg>
