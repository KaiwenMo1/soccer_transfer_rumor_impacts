name: Validate Project

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml_pipeline,api_server]"

      - name: Run Python tests
        run: PYTHONPATH=src python -m unittest tests.test_core

      - name: Compile CLI
        run: python -m py_compile src/transfer_stock/cli.py

      - name: Check dashboard JavaScript
        run: node --check app/static/dashboard.js

      - name: Inspect committed dashboard payload
        run: |
          PYTHONPATH=src python -m transfer_stock.cli inspect-demo-data \
            --input app/static/data/dashboard_data.json
