name: Nightly Live Refresh

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nightly-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
      GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
      PAGES_PAT: ${{ secrets.PAGES_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Backup current dashboard payload
        run: |
          mkdir -p /tmp/dashboard-backup
          cp app/static/data/dashboard_data.json /tmp/dashboard-backup/dashboard_data.json

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[scrape_v2,market_research,ml_pipeline,api_server]"

      - name: Fetch live articles
        id: fetch
        continue-on-error: true
        run: |
          PYTHONPATH=src python -m transfer_stock.cli refresh-live-fetch \
            --start "$(python -c 'from datetime import date, timedelta; print((date.today() - timedelta(days=21)).isoformat())')" \
            --end "$(python -c 'from datetime import date; print(date.today().isoformat())')" \
            --source-preset wide_no_api \
            --max-records 10 \
            --pause 0.1 \
            --clubs manchester_united borussia_dortmund juventus lazio ajax sporting_cp fc_porto celtic benfica eagle_football_group \
            --output data/raw/articles/current_live.jsonl

      - name: Analyze live articles and rebuild dashboard
        id: analyze
        if: ${{ steps.fetch.outcome == 'success' }}
        continue-on-error: true
        run: |
          PYTHONPATH=src python -m transfer_stock.cli refresh-live-analyze \
            --input data/raw/articles/current_live.jsonl \
            --clubs manchester_united borussia_dortmund juventus lazio ajax sporting_cp fc_porto celtic benfica eagle_football_group \
            --slug nightly_live \
            --dashboard-output app/static/data/dashboard_data.json

      - name: Restore previous dashboard if refresh failed
        if: ${{ steps.fetch.outcome != 'success' || steps.analyze.outcome == 'failure' }}
        run: |
          cp /tmp/dashboard-backup/dashboard_data.json app/static/data/dashboard_data.json

      - name: Write refresh status
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload_path = Path("app/static/data/dashboard_data.json")
          payload = json.loads(payload_path.read_text(encoding="utf-8"))
          payload["automation"] = {
              **payload.get("automation", {}),
              "workflow_refresh_attempted": True,
              "workflow_fetch_status": "${{ steps.fetch.outcome }}",
              "workflow_analyze_status": "${{ steps.analyze.outcome || 'skipped' }}",
          }
          payload_path.write_text(json.dumps(payload, indent=2), encoding="utf-8")
          PY

      - name: Upload live artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-refresh-artifacts
          path: |
            data/live
            app/static/data/dashboard_data.json

      - name: Setup Pages (auto-enable if PAT is present)
        if: ${{ env.PAGES_PAT != '' }}
        uses: actions/configure-pages@v6
        with:
          token: ${{ env.PAGES_PAT }}
          enablement: true

      - name: Setup Pages
        if: ${{ env.PAGES_PAT == '' }}
        uses: actions/configure-pages@v6

      - name: Upload static dashboard
        if: ${{ always() }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/static

      - name: Deploy
        if: ${{ always() }}
        id: deployment
        uses: actions/deploy-pages@v4
