name: Nightly Live Refresh

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      source_preset:
        description: "News source preset"
        required: false
        default: "fast_no_api"
        type: choice
        options:
          - fast_no_api
          - balanced_no_api
          - wide_no_api
          - scrapling_wide_no_api
      max_records:
        description: "Maximum articles per source/club"
        required: false
        default: "20"
      days_back:
        description: "Lookback window in days"
        required: false
        default: "21"
      commit_refreshed_data:
        description: "Commit refreshed static snapshots back to main"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
      GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
      PAGES_PAT: ${{ secrets.PAGES_PAT }}
      REFRESH_SOURCE_PRESET: ${{ inputs.source_preset || 'fast_no_api' }}
      REFRESH_MAX_RECORDS: ${{ inputs.max_records || '20' }}
      REFRESH_DAYS_BACK: ${{ inputs.days_back || '21' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[scrapling_scrape,market_research,ml_pipeline,api_server]"

      - name: Auto update live dashboard package
        id: auto_update
        run: |
          PYTHONPATH=src python -m transfer_stock.cli auto-update \
            --start "$(python -c 'from datetime import date, timedelta; import os; print((date.today() - timedelta(days=int(os.environ.get("REFRESH_DAYS_BACK", "21")))).isoformat())')" \
            --end "$(python -c 'from datetime import date; print(date.today().isoformat())')" \
            --source-preset "$REFRESH_SOURCE_PRESET" \
            --max-records "$REFRESH_MAX_RECORDS" \
            --pause 0.1 \
            --resume \
            --clubs manchester_united borussia_dortmund juventus lazio ajax sporting_cp fc_porto celtic benfica eagle_football_group \
            --slug nightly_live \
            --dashboard-output app/static/data/dashboard_data.json \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Commit refreshed static data
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.commit_refreshed_data) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/data app/static/.well-known data/reports/data_quality_audit.md data/reports/daily_briefing.md data/reports/daily_briefing.json data/operators/operator_latest.json data/operators/operator_latest.md data/processed/graphs/rumor_graph.json
          git diff --cached --quiet || git commit -m "Refresh live dashboard data [skip ci]"
          git push

      - name: Upload live artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-refresh-artifacts
          path: |
            data/live
            app/static/data/dashboard_data.json
            app/static/data/data_quality_latest.json
            app/static/data/operator_latest.json
            app/static/data/runbooks.json
            app/static/data/agent_reach.json
            app/static/.well-known/transfer-stock-agent.json
            app/static/data/rumor_graph.json
            data/processed/graphs/rumor_graph.json
            app/static/data/agent_latest.json
            app/static/data/rag_audit_latest.json
            data/reports/data_quality_audit.md
            data/operators/operator_latest.json
            data/operators/operator_latest.md

      - name: Setup Pages (auto-enable if PAT is present)
        if: ${{ env.PAGES_PAT != '' }}
        uses: actions/configure-pages@v6
        with:
          token: ${{ env.PAGES_PAT }}
          enablement: true

      - name: Setup Pages
        if: ${{ env.PAGES_PAT == '' }}
        uses: actions/configure-pages@v6

      - name: Upload static dashboard
        if: ${{ always() }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/static

      - name: Deploy
        if: ${{ always() }}
        id: deployment
        uses: actions/deploy-pages@v4
